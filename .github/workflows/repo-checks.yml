name: repo-checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step on purpose: these checks are dependency-free.
      - name: Repository structure and secret guard
        run: node tools/check-repo.mjs
      - name: Guard refuses paths outside the repository
        run: |
          set +e
          node tools/guard.mjs ../outside 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "guard should exit 1 for a path outside NEW, got $code"
            exit 1
          fi
      - name: Guard accepts a path inside the repository
        run: node tools/guard.mjs docs
